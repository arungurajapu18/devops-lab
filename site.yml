
---
- name: Provision the tradelive VM
  hosts: tradelive
  become: yes

  tasks:
    - name: Install libpam-pwquality
      apt:
        name: libpam-pwquality
        update_cache: yes
        state: present

    - name: Configure password quality policy
      lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^\s*password\s+requisite\s+pam_pwquality\.so'
        line: 'password requisite pam_pwquality.so minlen=12 lcredit=-1 ucredit=-1 dcredit=-1 ocredit=-1 retry=3'
        state: present

    - name: Ensure the developers group exists
      group:
        name: developers
        state: present

    - name: Create the trader user
      user:
        name: trader
        state: present
        create_home: yes
        shell: /bin/bash
        groups: developers
        append: yes

    - name: Install SSH public key for trader
      authorized_key:
        user: trader
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Install the Google Authenticator PAM module
      apt:
        name: libpam-google-authenticator
        update_cache: yes
        state: present

    - name: Tell PAM to use Google Authenticator for SSH
      lineinfile:
        path: /etc/pam.d/sshd
        line: "auth required pam_google_authenticator.so nullok"
        state: present
      notify: Restart SSH

    - name: Turn off PAM password logins for SSH
      lineinfile:
        path: /etc/pam.d/sshd
        regexp: '^@include common-auth'
        line: "#@include common-auth"
      notify: Restart SSH

    - name: Allow keyboard-interactive logins
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?KbdInteractiveAuthentication'
        line: "KbdInteractiveAuthentication yes"
      notify: Restart SSH

    - name: Require key AND code for trader only
      blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} TRADER 2FA"
        block: |
          Match User trader
            AuthenticationMethods publickey,keyboard-interactive
      notify: Restart SSH

    - name: Install a sudoers policy for the developers group
      copy:
        content: |
          Cmnd_Alias GREETING_CTL = /usr/bin/systemctl start greeting, \
                                    /usr/bin/systemctl stop greeting, \
                                    /usr/bin/systemctl restart greeting, \
                                    /usr/bin/systemctl status greeting

          %developers ALL=(root) NOPASSWD: GREETING_CTL, \
                                           sudoedit /opt/engineering/greeting.py
        dest: /etc/sudoers.d/developers
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted

